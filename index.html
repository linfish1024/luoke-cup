<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0F9D58" />
<title>洛可杯 2026 ⚽ 世界杯足球</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:linear-gradient(135deg,#0a7042 0%,#0F9D58 100%);color:#fff;min-height:100vh;overflow-x:hidden;user-select:none}
  .app{max-width:480px;margin:0 auto;padding:12px;min-height:100vh}
  /* Header */
  .header{text-align:center;padding:14px 8px 8px}
  .trophy{font-size:42px;display:block;margin-bottom:2px}
  h1{font-size:24px;margin:0 0 2px;font-weight:800;letter-spacing:-0.5px}
  .subtitle{color:rgba(255,255,255,0.8);font-size:12px}
  /* Cards */
  .card{background:rgba(255,255,255,0.95);border-radius:14px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,0.2);margin-bottom:12px;color:#1a1a1a}
  .card-title{font-size:16px;font-weight:700;color:#0a7042;margin:0 0 10px;display:flex;align-items:center;gap:6px}
  /* Buttons */
  .btn{background:linear-gradient(135deg,#FFD700,#FFA000);color:#4a3000;border:none;padding:12px 18px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:transform 0.1s;display:flex;align-items:center;justify-content:center;gap:6px;text-shadow:0 1px 0 rgba(255,255,255,0.3)}
  .btn:active{transform:scale(0.97)}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  .btn-green{background:linear-gradient(135deg,#0F9D58,#0a7042);color:#fff;text-shadow:none}
  .btn-blue{background:linear-gradient(135deg,#2196F3,#1976D2);color:#fff;text-shadow:none}
  .btn-red{background:linear-gradient(135deg,#f44336,#d32f2f);color:#fff;text-shadow:none}
  .btn-row{display:flex;gap:6px;margin-top:8px}
  .btn-row .btn{flex:1;padding:10px;font-size:13px}
  .btn-sm{padding:8px 12px;font-size:13px;width:auto}
  /* Input */
  input[type="text"]{width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:8px;font-size:15px}
  input[type="text"]:focus{outline:none;border-color:#0F9D58}
  /* Team list */
  .team-pick{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:300px;overflow-y:auto;padding:4px}
  .team-tile{background:#f5f5f5;border:2px solid transparent;border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:#333}
  .team-tile.active{background:#0F9D58;color:#fff;border-color:#0a7042}
  .team-tile .flag{font-size:20px;display:block;margin-bottom:2px}
  /* Game canvas */
  .game-wrap{position:relative;width:100%;background:#0a7042;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.4);aspect-ratio:1/1.3}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .game-hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
  .hud-score{background:rgba(0,0,0,0.7);color:#fff;padding:6px 12px;border-radius:20px;font-weight:800;font-size:14px;backdrop-filter:blur(4px)}
  .hud-time{background:rgba(0,0,0,0.7);color:#FFD700;padding:6px 12px;border-radius:20px;font-weight:700;font-size:13px;font-family:monospace}
  .game-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#FFD700;padding:14px 24px;border-radius:14px;font-size:20px;font-weight:800;text-align:center;z-index:10;pointer-events:none;animation:pop 0.4s;border:3px solid #FFD700}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
  /* Joystick */
  .joystick{position:absolute;bottom:20px;left:20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.4);z-index:8;touch-action:none}
  .joystick-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.6);border:2px solid rgba(255,255,255,0.8);transition:transform 0.05s}
  /* Action buttons */
  .action-btns{position:absolute;bottom:20px;right:20px;display:flex;gap:10px;z-index:8}
  .action-btn{width:60px;height:60px;border-radius:50%;border:3px solid rgba(255,255,255,0.4);color:#fff;font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px rgba(0,0,0,0.5)}
  .btn-shoot{background:rgba(244,67,54,0.7)}
  .btn-pass{background:rgba(33,150,243,0.7)}
  .btn-sprint{background:rgba(255,152,0,0.7)}
  /* Difficulty pills */
  .diff-row{display:flex;gap:6px;margin-bottom:10px}
  .diff-pill{flex:1;padding:8px;text-align:center;background:#f5f5f5;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;color:#666}
  .diff-pill.active{background:#0F9D58;color:#fff}
  /* Game over */
  .gameover{text-align:center;padding:20px}
  .gameover h2{font-size:28px;color:#FFD700;margin-bottom:8px}
  .gameover .big{font-size:36px;font-weight:800;margin:12px 0}
  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .stat-box{background:rgba(255,255,255,0.1);padding:8px;border-radius:8px}
  .stat-label{font-size:11px;opacity:0.8}
  .stat-value{font-size:20px;font-weight:800;color:#FFD700}
  /* Top nav */
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.9);display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:50;backdrop-filter:blur(8px)}
  .tab{flex:1;text-align:center;padding:4px;color:rgba(255,255,255,0.6);font-size:10px;cursor:pointer}
  .tab.active{color:#FFD700}
  .tab-emoji{font-size:20px;display:block}
  .content{padding-bottom:70px}
  .hidden{display:none!important}
  .text-center{text-align:center}
  .mt-8{margin-top:8px}.mt-12{margin-top:12px}
  .empty-state{text-align:center;padding:24px;color:#666}
  .controls-hint{background:rgba(0,0,0,0.6);color:#fff;padding:8px 12px;border-radius:8px;font-size:11px;margin-top:8px;line-height:1.5}
  .badge{display:inline-block;background:#0F9D58;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;margin:2px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="tabbar hidden" id="tabbar">
  <div class="tab active" data-tab="home"><span class="tab-emoji">🏠</span>主页</div>
  <div class="tab" data-tab="play"><span class="tab-emoji">⚽</span>开球</div>
  <div class="tab" data-tab="tournament"><span class="tab-emoji">🏆</span>赛事</div>
  <div class="tab" data-tab="history"><span class="tab-emoji">📜</span>战报</div>
</div>

<script>

  'arg':{n:'阿根廷',f:'🇦🇷',e:1870,r:1,att:92,def:86,speed:80,star:3},

  // K
  'por':{n:'葡萄牙',f:'🇵🇹',e:1750,r:6,att:84,def:80,speed:78},
  'icp-1':{n:'伊拉克',f:'🇮🇶',e:1480,r:55,att:68,def:66,speed:70}, // 洲际附加赛1胜者
  'uzb':{n:'乌兹别克',f:'🇺🇿',e:1480,r:50,att:68,def:66,speed:70},
  'col':{n:'哥伦比亚',f:'🇨🇴',e:1720,r:12,att:82,def:74,speed:80},
  // L
  'eng':{n:'英格兰',f:'🏴',e:1800,r:4,att:88,def:82,speed:82,star:1},

  'gha':{n:'加纳',f:'🇬🇭',e:1380,r:71,att:62,def:60,speed:74},
  'pan':{n:'巴拿马',f:'🇵🇦',e:1600,r:30,att:72,def:70,speed:72}
};

const GROUPS = {
  A:['mex','rsa','kor','eur-d'],B:['can','eur-a','qat','sui'],
  C:['bra','mar','hai','sco'],D:['usa','par','aus','eur-c'],
  E:['ger','cuw','civ','ecu'],F:['ned','jpn','eur-b','tun'],
  G:['bel','egy','irn','nzl'],H:['esp','cpv','ksa','uru'],
  I:['fra','sen','icp-2','nor'],J:['arg','alg','aut','jor'],
  K:['por','icp-1','uzb','col'],L:['eng','cro','gha','pan']
};

// ============= 状态 =============
const state = {
  view:'home',
  playerName:'洛可',
  selectedTeam:null,
  opponent:null,
  difficulty:'medium', // easy/medium/hard
  // Tournament
  tournament:{teams:null,round:0,bracket:null,results:[],myTeam:null},
  // History
  history:[],
  // Active game
  game:null
};

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const save = () => localStorage.setItem('luoke-cup-v2', JSON.stringify({p:state.playerName,h:state.history,t:state.tournament}));
const load = () => {
  try {
    const s = JSON.parse(localStorage.getItem('luoke-cup-v2'));
    if (s) {
      state.playerName = s.p || '洛可';
      state.history = s.h || [];
      state.tournament = s.t || {teams:null,round:0,bracket:null,results:[],myTeam:null};
    }
  } catch(e){}
};
load();

const teamById = (id) => TEAMS[id];
const flag = (id) => TEAMS[id].f;
const name = (id) => TEAMS[id].n;

// ============= 渲染 =============
const render = () => {
  const app = $('#app');
  app.innerHTML = '';
  if (state.view === 'home') renderHome(app);
  else if (state.view === 'pick') renderPick(app);
  else if (state.view === 'play') renderGame(app);
  else if (state.view === 'gameover') renderGameOver(app);
  else if (state.view === 'tournament') renderTournament(app);
  else if (state.view === 'history') renderHistory(app);
  $('#tabbar').classList.toggle('hidden', ['play','gameover'].includes(state.view));
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.view));
};

// === 主页 ===
const renderHome = (app) => {
  app.innerHTML = `
    <div class="header">
      <span class="trophy">🏆</span>
      <h1>洛可杯 2026</h1>
      <div class="subtitle">⚽ 世界杯足球 · 真·操控版</div>
    </div>
    <div class="card">
      <div class="card-title">👋 玩家：<span id="playerName">${state.playerName}</span></div>
      <input type="text" id="nameInput" value="${state.playerName}" placeholder="输入你的名字" maxlength="8" />
    </div>
    <div class="card">
      <div class="card-title">🎮 开球</div>
      <button class="btn" id="goPick">⚽ 快速比赛（选队开打）</button>
      <button class="btn btn-blue mt-8" id="goTournament">🏆 洛可杯赛（小组+淘汰）</button>
    </div>
    <div class="card">
      <div class="card-title">📊 战绩</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <div class="stat-box" style="background:#0F9D58"><div class="stat-label" style="color:#fff">胜</div><div class="stat-value" id="statW" style="color:#fff">${countWins()}</div></div>
        <div class="stat-box" style="background:#2196F3"><div class="stat-label" style="color:#fff">平</div><div class="stat-value" id="statD" style="color:#fff">${countDraws()}</div></div>
        <div class="stat-box" style="background:#f44336"><div class="stat-label" style="color:#fff">负</div><div class="stat-value" id="statL" style="color:#fff">${countLosses()}</div></div>
      </div>
      <div class="mt-8" style="text-align:center;font-size:12px;color:#666">总进球：<strong>${totalGoals()}</strong> · 比赛：<strong>${state.history.length}</strong> 场</div>
    </div>
    <div class="card">
      <div class="card-title">ℹ️ 玩法</div>
      <div style="font-size:12px;line-height:1.7;color:#333">
        🎮 <strong>左摇杆</strong>控制球员移动<br>
        🔴 <strong>射门</strong> · 🔵 <strong>传球</strong> · 🟠 <strong>冲刺</strong><br>
        进球积累能量，淘汰赛走得更远 🏆
      </div>
    </div>
  `;
  $('#nameInput').addEventListener('change', e => { state.playerName = e.target.value || '洛可'; save(); });
  $('#goPick').addEventListener('click', () => { state.view = 'pick'; render(); });
  $('#goTournament').addEventListener('click', () => { state.view = 'tournament'; render(); });
};
const countWins = () => state.history.filter(h => h.result === 'W').length;
const countDraws = () => state.history.filter(h => h.result === 'D').length;
const countLosses = () => state.history.filter(h => h.result === 'L').length;
const totalGoals = () => state.history.reduce((s, h) => s + h.gf, 0);

// === 选队 ===
const renderPick = (app) => {
  const allIds = Object.keys(TEAMS);
  app.innerHTML = `
    <div class="header"><h1>⚽ 选你的主队</h1><div class="subtitle">48 强随便挑</div></div>
    <div class="card">
      <div class="card-title">选择难度</div>
      <div class="diff-row">
        <div class="diff-pill ${state.difficulty==='easy'?'active':''}" data-diff="easy">😊 简单</div>
        <div class="diff-pill ${state.difficulty==='medium'?'active':''}" data-diff="medium">😎 普通</div>
        <div class="diff-pill ${state.difficulty==='hard'?'active':''}" data-diff="hard">🔥 困难</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">我的主队</div>
      <div class="team-pick" id="myTeamGrid">
        ${allIds.map(id => `<div class="team-tile" data-id="${id}"><span class="flag">${TEAMS[id].f}</span>${TEAMS[id].n}</div>`).join('')}
      </div>
    </div>
    <div class="card">
      <button class="btn" id="confirmPick" disabled>选好了开打 →</button>
      <button class="btn btn-blue mt-8" id="goHome">← 回去</button>
    </div>
  `;
  $$('.diff-pill').forEach(p => p.addEventListener('click', () => {
    state.difficulty = p.dataset.diff;
    render();
  }));
  $$('.team-tile').forEach(t => t.addEventListener('click', () => {
    $$('.team-tile').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    state.selectedTeam = t.dataset.id;
    $('#confirmPick').disabled = false;
  }));
  $('#confirmPick').addEventListener('click', () => {
    if (!state.selectedTeam) return;
    // 随机选对手（不同组别）
    const myGroup = Object.keys(GROUPS).find(g => GROUPS[g].includes(state.selectedTeam));
    const otherIds = Object.keys(TEAMS).filter(id => id !== state.selectedTeam);
    state.opponent = otherIds[Math.floor(Math.random() * otherIds.length)];
    startQuickMatch();
  });
  $('#goHome').addEventListener('click', () => { state.view = 'home'; render(); });
};

// ============= 2D 足球引擎 =============
const FIELD = { W: 400, H: 520 };
const PITCH = { x: 10, y: 50, w: 380, h: 460 };

let canvas, ctx, gameLoop, gameState, joystick, joystickActive, joystickDX, joystickDY;

const startQuickMatch = () => {
  state.view = 'play';
  state.game = {
    phase: 'kickoff', // kickoff, playing, halftime, ended
    time: 0, // 0-90
    score: [0, 0],
    ball: { x: FIELD.W/2, y: FIELD.H/2, vx: 0, vy: 0, owner: null, ownerTeam: 0, radius: 5 },
    players: [],
    messages: [],
    paused: false
  };
  initPlayers();
  render();
  setTimeout(() => {
    canvas = $('#gameCanvas');
    ctx = canvas.getContext('2d');
    canvas.width = FIELD.W; canvas.height = FIELD.H;
    initJoystick();
    initActions();
    if (gameLoop) cancelAnimationFrame(gameLoop);
    lastTime = 0;
    // 第一次自动开球（我方开球）
    setTimeout(() => {
      if (state.game && state.game.phase === 'kickoff') {
        // 我方中圈开球
        const myGK = state.game.players.find(p => p.team === 0 && p.role === 'MID');
        if (myGK) {
          state.game.ball.owner = myGK;
          state.game.ball.ownerTeam = 0;
        }
        state.game.phase = 'playing';
        showMsg('开球！');
      }
    }, 1500);
    gameLoop = requestAnimationFrame(loop);
    startLoop();
  }, 100);
};

const initPlayers = () => {
  const myT = TEAMS[state.selectedTeam];
  const opT = TEAMS[state.opponent];
  const mySpeed = (myT.speed + 100) / 100;
  const opSpeed = (opT.speed + 100) / 100;
  const diffSpeed = state.difficulty === 'easy' ? 0.8 : state.difficulty === 'medium' ? 1.0 : 1.2;
  // 我方 5 球员：1 守门员 + 4 队友；AI 5 球员：1 守门 + 4 进攻
  const myPositions = [
    { x: FIELD.W/2, y: 470, role: 'GK' }, // 守门
    { x: FIELD.W*0.3, y: 380, role: 'DEF' },
    { x: FIELD.W*0.7, y: 380, role: 'DEF' },
    { x: FIELD.W*0.3, y: 280, role: 'MID' },
    { x: FIELD.W*0.7, y: 280, role: 'MID' }
  ];
  const opPositions = [
    { x: FIELD.W/2, y: 50, role: 'GK' },
    { x: FIELD.W*0.3, y: 140, role: 'DEF' },
    { x: FIELD.W*0.7, y: 140, role: 'DEF' },
    { x: FIELD.W*0.3, y: 240, role: 'MID' },
    { x: FIELD.W*0.7, y: 240, role: 'MID' }
  ];
  state.game.players = [];
  myPositions.forEach((p, i) => {
    state.game.players.push({
      x: p.x, y: p.y, vx: 0, vy: 0,
      team: 0, role: p.role, isUser: i === 2, // 第3个球员(中场)是用户控制
      speed: mySpeed * (i === 0 ? 0.9 : 1.0),
      att: myT.att, def: myT.def, e: myT.e,
      radius: 8
    });
  });
  opPositions.forEach((p, i) => {
    state.game.players.push({
      x: p.x, y: p.y, vx: 0, vy: 0,
      team: 1, role: p.role, isUser: false,
      speed: opSpeed * (i === 0 ? 0.9 : 1.0) * diffSpeed,
      att: opT.att, def: opT.def, e: opT.e,
      radius: 8
    });
  });
};

const user = () => state.game.players.find(p => p.isUser);

let joystickTouchId = null;
const initJoystick = () => {
  joystick = $('#joystick');
  const knob = $('#joystickKnob');
  // Pointer Events 统一处理（兼容 iOS/Android/桌面）
  const opts = {passive:false};
  if (window.PointerEvent) {
    joystick.addEventListener('pointerdown', onJoyStart, opts);
    joystick.addEventListener('pointermove', onJoyMove, opts);
    joystick.addEventListener('pointerup', onJoyEnd, opts);
    joystick.addEventListener('pointercancel', onJoyEnd, opts);
  } else {
    joystick.addEventListener('touchstart', onJoyStart, opts);
    joystick.addEventListener('touchmove', onJoyMove, opts);
    joystick.addEventListener('touchend', onJoyEnd, opts);
    joystick.addEventListener('touchcancel', onJoyEnd, opts);
    joystick.addEventListener('mousedown', onJoyStart);
    document.addEventListener('mousemove', onJoyMove);
    document.addEventListener('mouseup', onJoyEnd);
  }
  joystickActive = false; joystickDX = 0; joystickDY = 0;
};
const getPointerXY = (e) => {
  if (e.touches && e.touches.length) return {x: e.touches[0].clientX, y: e.touches[0].clientY};
  if (e.changedTouches && e.changedTouches.length) return {x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY};
  return {x: e.clientX, y: e.clientY};
};
const onJoyStart = (e) => { e.preventDefault(); joystickActive = true; joystickTouchId = e.pointerId || (e.touches?.[0]?.identifier ?? null); };
const onJoyMove = (e) => {
  if (!joystickActive) return;
  e.preventDefault();
  const p = getPointerXY(e);
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  let dx = p.x - cx, dy = p.y - cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const maxR = rect.width/2 - 25;
  if (dist > maxR) { dx = dx/dist*maxR; dy = dy/dist*maxR; }
  $('#joystickKnob').style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joystickDX = dx/maxR; joystickDY = dy/maxR;
};
const onJoyEnd = (e) => { joystickActive = false; joystickDX = 0; joystickDY = 0; $('#joystickKnob').style.transform = 'translate(-50%,-50%)'; joystickTouchId = null; };

const initActions = () => {
  const opts = {passive:false};
  if (window.PointerEvent) {
    $('#btnShoot').addEventListener('pointerdown', e => { e.preventDefault(); shoot(); }, opts);
    $('#btnPass').addEventListener('pointerdown', e => { e.preventDefault(); passBall(); }, opts);
    $('#btnSprint').addEventListener('pointerdown', e => { e.preventDefault(); sprint(); }, opts);
  } else {
    $('#btnShoot').addEventListener('touchstart', e => { e.preventDefault(); shoot(); }, opts);
    $('#btnPass').addEventListener('touchstart', e => { e.preventDefault(); passBall(); }, opts);
    $('#btnSprint').addEventListener('touchstart', e => { e.preventDefault(); sprint(); }, opts);
    $('#btnShoot').addEventListener('mousedown', shoot);
    $('#btnPass').addEventListener('mousedown', passBall);
    $('#btnSprint').addEventListener('mousedown', sprint);
  }
};

let sprintEnd = 0;
const shoot = () => {
  if (state.game.phase !== 'playing') return;
  const u = user();
  if (!u) return;
  // 只有持球时能射
  if (state.game.ball.owner !== u && distance(state.game.ball, u) > 14) return;
  // 找球门方向
  const targetX = FIELD.W/2;
  const targetY = u.team === 0 ? 30 : 490;
  const dx = targetX - u.x, dy = targetY - u.y;
  const len = Math.sqrt(dx*dx+dy*dy);
  // 射门力度
  const power = 8 + Math.random() * 4;
  state.game.ball.vx = (dx/len) * power;
  state.game.ball.vy = (dy/len) * power;
  state.game.ball.owner = null;
  state.game.ball.ownerTeam = u.team;
  showMsg('射门！');
};
const passBall = () => {
  if (state.game.phase !== 'playing') return;
  const u = user();
  if (!u) return;
  if (state.game.ball.owner !== u) return;
  // 找最近的队友
  const teammates = state.game.players.filter(p => p.team === u.team && p !== u);
  if (teammates.length === 0) return;
  teammates.sort((a,b) => distance(a,u) - distance(b,u));
  const target = teammates[0];
  const dx = target.x - u.x, dy = target.y - u.y;
  const len = Math.sqrt(dx*dx+dy*dy) || 1;
  state.game.ball.vx = (dx/len) * 5;
  state.game.ball.vy = (dy/len) * 5;
  state.game.ball.owner = null;
  state.game.ball.ownerTeam = u.team;
  showMsg('传球！');
};
const sprint = () => { sprintEnd = Date.now() + 1500; showMsg('冲刺!'); };

const distance = (a, b) => Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);

const showMsg = (text, color='#FFD700') => {
  state.game.messages.push({text, color, time: Date.now()});
};

const update = (dt) => {
  const g = state.game;
  if (g.phase === 'ended') return;
  if (g.phase === 'kickoff') {
    g.ball.x = FIELD.W/2; g.ball.y = FIELD.H/2;
    g.ball.vx = 0; g.ball.vy = 0;
    return;
  }
  // 时间推进（每真实秒 = 20秒比赛时间）
  g.time += dt * 0.02;
  if (g.time >= 45 && g.phase === 'playing') {
    g.phase = 'halftime';
    g.score[1] = g.score[1]; // 半场
    setTimeout(() => {
      g.phase = 'playing';
      g.ball.x = FIELD.W/2; g.ball.y = FIELD.H/2;
      g.ball.vx = 0; g.ball.vy = 0;
      g.ball.owner = null;
      g.time = 45;
      showMsg('下半场！');
    }, 2000);
    showMsg('中场休息');
    return;
  }
  if (g.time >= 90) {
    g.phase = 'ended';
    finishMatch();
    return;
  }
  // 用户控制
  const u = user();
  if (u) {
    const sprinting = Date.now() < sprintEnd;
    const spd = u.speed * (sprinting ? 1.4 : 1.0) * 65 * dt;
    u.x += joystickDX * spd;
    u.y += joystickDY * spd;
    u.x = Math.max(20, Math.min(FIELD.W-20, u.x));
    u.y = Math.max(50, Math.min(FIELD.H-50, u.y));
  }
  // AI 控制
  state.game.players.forEach(p => {
    if (p.isUser) return;
    updateAI(p, dt);
    p.x = Math.max(20, Math.min(FIELD.W-20, p.x));
    p.y = Math.max(20, Math.min(FIELD.H-20, p.y));
  });
  // 球物理
  updateBall(dt);
  // 检查进球
  checkGoal();
  // 清理消息
  g.messages = g.messages.filter(m => Date.now() - m.time < 1500);
};

const updateAI = (p, dt) => {
  const g = state.game;
  const ball = g.ball;
  const teamHasBall = ball.owner ? ball.owner.team === p.team : null;
  // 守门员：守住球门
  if (p.role === 'GK') {
    const targetX = p.team === 0 ? FIELD.W/2 : FIELD.W/2;
    const targetY = p.team === 0 ? 470 : 50;
    const ballDist = distance(p, ball);
    if (ballDist < 100) {
      p.x += (ball.x - p.x) * 0.05;
      p.y += (ball.y + (p.team === 0 ? 20 : -20) - p.y) * 0.1;
    } else {
      p.x += (targetX - p.x) * 0.05;
      p.y += (targetY - p.y) * 0.05;
    }
    return;
  }
  // 其他球员：寻球逻辑
  const ballOwner = ball.owner;
  // 如果本方持球 → 跑位
  if (teamHasBall === true && p.team === ball.owner.team) {
    // 队友持球：跑向对方球门
    const targetY = p.team === 0 ? 30 : 490;
    p.x += ((Math.random() * FIELD.W * 0.6 + FIELD.W * 0.2) - p.x) * 0.02;
    p.y += (targetY - p.y) * 0.02;
  } else if (teamHasBall === false) {
    // 对方持球：追球
    const dx = ball.x - p.x, dy = ball.y - p.y;
    const len = Math.sqrt(dx*dx+dy*dy) || 1;
    p.x += (dx/len) * p.speed * 65 * dt * 0.7;
    p.y += (dy/len) * p.speed * 65 * dt * 0.7;
  } else {
    // 球无人：去抢球
    const dx = ball.x - p.x, dy = ball.y - p.y;
    const len = Math.sqrt(dx*dx+dy*dy) || 1;
    p.x += (dx/len) * p.speed * 65 * dt * 0.8;
    p.y += (dy/len) * p.speed * 65 * dt * 0.8;
  }
  // 抢球判定
  if (distance(p, ball) < 14) {
    if (ball.owner === null) {
      // 争球：ELO 高的赢
      const win = Math.random() * (p.e + 100) > 50;
      if (win) { ball.owner = p; ball.ownerTeam = p.team; }
    } else if (ball.owner.team !== p.team && Math.random() < 0.025 * p.speed) {
      // 抢断
      ball.owner = p;
      ball.ownerTeam = p.team;
      showMsg('抢断！');
    }
  }
  // 持球者偶尔射门/传球（频率降低，加入位置判断）
  if (ball.owner === p) {
    // 随机叠加：避免一直重复模式
    p.aiCooldown = (p.aiCooldown || 0) - 1;
    if (p.aiCooldown <= 0) {
      p.aiCooldown = 60 + Math.floor(Math.random() * 120); // 1-3秒冷却
      if (p.team === 1 && p.y > 400 && Math.random() < 0.6) {
        shootFor(p);
      } else if (p.team === 0 && p.y < 120 && Math.random() < 0.4) {
        // 我方队友进了禁区才射
        shootFor(p);
      } else if (Math.random() < 0.3) {
        // AI 传球（不随机选最近的，选接球位好的）
        const mates = state.game.players.filter(m => m.team === p.team && m !== p);
        if (mates.length) {
          // 按位置优势排序（我方越靠近对方球门越好）
          mates.sort((a, b) => {
            const ga = p.team === 0 ? a.y : FIELD.H - a.y;
            const gb = p.team === 0 ? b.y : FIELD.H - b.y;
            return gb - ga;
          });
          // 随机选 top-2 中一个（避免太机械）
          const candidates = mates.slice(0, 2);
          const target = candidates[Math.floor(Math.random() * candidates.length)];
          const dx = target.x - p.x, dy = target.y - p.y;
          const len = Math.sqrt(dx*dx+dy*dy) || 1;
          ball.vx = (dx/len) * 4;
          ball.vy = (dy/len) * 4;
          ball.owner = null;
          ball.ownerTeam = p.team;
          showMsg('传球！');
        }
      }
    }
  }
};

const shootFor = (p) => {
  const targetX = FIELD.W/2 + (Math.random() - 0.5) * 80;
  const targetY = p.team === 0 ? 30 : 490;
  const dx = targetX - p.x, dy = targetY - p.y;
  const len = Math.sqrt(dx*dx+dy*dy);
  const power = 7 + Math.random() * 3;
  state.game.ball.vx = (dx/len) * power;
  state.game.ball.vy = (dy/len) * power;
  state.game.ball.owner = null;
  state.game.ball.ownerTeam = p.team;
  showMsg(p.team === 0 ? '队友射门！' : '对方射门！');
};

const updateBall = (dt) => {
  const g = state.game;
  const b = g.ball;
  if (b.owner) {
    // 跟着主人
    b.x = b.owner.x + (b.owner.team === 0 ? 0 : 0);
    b.y = b.owner.y + (b.owner.team === 0 ? -6 : 6);
    b.vx = 0; b.vy = 0;
  } else {
    b.x += b.vx;
    b.y += b.vy;
    b.vx *= 0.92;
    b.vy *= 0.92;
    if (Math.abs(b.vx) < 0.15) b.vx = 0;
    if (Math.abs(b.vy) < 0.15) b.vy = 0;
    // 边界
    if (b.x < 8 || b.x > FIELD.W - 8) b.vx *= -0.8;
    if (b.y < 8 || b.y > FIELD.H - 8) b.vy *= -0.8;
    b.x = Math.max(8, Math.min(FIELD.W-8, b.x));
    b.y = Math.max(8, Math.min(FIELD.H-8, b.y));
    // 速度太低则停止
    if (Math.abs(b.vx) < 0.3 && Math.abs(b.vy) < 0.3 && b.y > 30 && b.y < FIELD.H - 30) {
      b.vx = 0; b.vy = 0;
    }
    // 检查球员触球
    g.players.forEach(p => {
      if (distance(p, b) < p.radius + 2) {
        if (b.owner === null || b.owner !== p) {
          b.owner = p;
          b.ownerTeam = p.team;
        }
      }
    });
  }
};

const checkGoal = () => {
  const g = state.game;
  const b = g.ball;
  // 上方球门（对方）y=0..30
  if (b.y < 5 && b.x > FIELD.W/2 - 40 && b.x < FIELD.W/2 + 40) {
    // 我方进球
    g.score[0]++;
    showMsg('⚽ 进球！！', '#FFD700');
    b.x = FIELD.W/2; b.y = FIELD.H/2; b.vx = 0; b.vy = 0; b.owner = null;
  }
  // 下方球门（我方）y=515..520
  if (b.y > FIELD.H - 5 && b.x > FIELD.W/2 - 40 && b.x < FIELD.W/2 + 40) {
    // 对方进球
    g.score[1]++;
    showMsg('对方进球...', '#f44336');
    b.x = FIELD.W/2; b.y = FIELD.H/2; b.vx = 0; b.vy = 0; b.owner = null;
  }
};

let lastTime = 0;
let gameInterval = null;
const loop = (t) => {
  if (!state.game) return;
  const dt = Math.min(0.05, (t - lastTime) / 1000 || 0.016);
  lastTime = t;
  update(dt);
  draw();
  if (state.game.phase === 'ended') {
    cancelAnimationFrame(gameLoop);
    if (gameInterval) { clearInterval(gameInterval); gameInterval = null; }
    return;
  }
};

const startLoop = () => {
  if (gameLoop) cancelAnimationFrame(gameLoop);
  if (gameInterval) clearInterval(gameInterval);
  lastTime = performance.now();
  // 兠底：用 setInterval 代替 RAF（headless/后台 tab 不卡）
  gameInterval = setInterval(() => {
    if (!state.game) return;
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    draw();
  }, 16);
  gameLoop = requestAnimationFrame((t) => { lastTime = t; loop(t); });
};

const draw = () => {
  const g = state.game;
  if (!g) return;
  const c = ctx;
  c.clearRect(0, 0, FIELD.W, FIELD.H);
  // 草地
  c.fillStyle = '#0a7042';
  c.fillRect(0, 0, FIELD.W, FIELD.H);
  // 草条纹
  for (let i = 0; i < 12; i++) {
    c.fillStyle = i % 2 ? '#0c7d4a' : '#0a7042';
    c.fillRect(0, i * FIELD.H / 12, FIELD.W, FIELD.H / 12);
  }
  // 中线
  c.strokeStyle = 'rgba(255,255,255,0.4)';
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(0, FIELD.H/2); c.lineTo(FIELD.W, FIELD.H/2);
  c.stroke();
  // 中圈
  c.beginPath();
  c.arc(FIELD.W/2, FIELD.H/2, 40, 0, Math.PI*2);
  c.stroke();
  // 球门
  c.fillStyle = 'rgba(255,255,255,0.15)';
  c.fillRect(FIELD.W/2 - 40, 0, 80, 8);
  c.fillRect(FIELD.W/2 - 40, FIELD.H-8, 80, 8);
  c.strokeStyle = 'rgba(255,255,255,0.6)';
  c.lineWidth = 2;
  c.strokeRect(FIELD.W/2 - 40, 0, 80, 8);
  c.strokeRect(FIELD.W/2 - 40, FIELD.H-8, 80, 8);
  // 禁区
  c.strokeRect(FIELD.W/2 - 60, 0, 120, 70);
  c.strokeRect(FIELD.W/2 - 60, FIELD.H-70, 120, 70);
  // 球员
  g.players.forEach(p => {
    c.beginPath();
    c.arc(p.x, p.y, p.radius, 0, Math.PI*2);
    c.fillStyle = p.team === 0 ? '#2196F3' : '#f44336';
    c.fill();
    c.strokeStyle = p.isUser ? '#FFD700' : 'rgba(255,255,255,0.5)';
    c.lineWidth = p.isUser ? 3 : 1;
    c.stroke();
    // 球衣号
    c.fillStyle = '#fff';
    c.font = 'bold 9px sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(p.isUser ? '★' : p.role.charAt(0), p.x, p.y);
  });
  // 球
  c.beginPath();
  c.arc(g.ball.x, g.ball.y, g.ball.radius, 0, Math.PI*2);
  c.fillStyle = '#fff';
  c.fill();
  c.strokeStyle = '#000';
  c.lineWidth = 1;
  c.stroke();
  // HUD
  c.fillStyle = 'rgba(0,0,0,0.7)';
  c.fillRect(0, 0, FIELD.W, 40);
  c.fillStyle = '#fff';
  c.font = 'bold 14px sans-serif';
  c.textAlign = 'left';
  c.fillText(`${flag(state.selectedTeam)} ${name(state.selectedTeam)} ${g.score[0]}`, 8, 16);
  c.textAlign = 'right';
  c.fillText(`${g.score[1]} ${flag(state.opponent)} ${name(state.opponent)}`, FIELD.W-8, 16);
  c.fillStyle = '#FFD700';
  c.textAlign = 'center';
  c.font = 'bold 12px monospace';
  c.fillText(`${Math.floor(g.time)}'`, FIELD.W/2, 16);
  c.font = '10px sans-serif';
  c.fillStyle = 'rgba(255,255,255,0.6)';
  c.fillText(g.phase === 'halftime' ? '中场' : (g.phase === 'ended' ? '结束' : ''), FIELD.W/2, 30);
  // 消息
  g.messages.forEach((m, i) => {
    c.fillStyle = m.color;
    c.font = 'bold 18px sans-serif';
    c.textAlign = 'center';
    c.fillText(m.text, FIELD.W/2, 80 + i*30);
  });
};

const finishMatch = () => {
  const g = state.game;
  const [gf, ga] = g.score;
  let result = gf > ga ? 'W' : (gf < ga ? 'L' : 'D');
  const match = {
    date: new Date().toISOString(),
    myTeam: state.selectedTeam,
    opp: state.opponent,
    gf, ga, result,
    diff: state.difficulty
  };
  state.history.unshift(match);
  if (state.history.length > 50) state.history = state.history.slice(0, 50);
  save();
  // Tournament 模式：自动加下一场
  if (state.tournament.round > 0) {
    state.tournament.results.push(match);
    state.tournament.round++;
    save();
  }
  state.view = 'gameover';
  state.lastMatch = match;
  render();
};

// === 比赛结束画面 ===
const renderGameOver = (app) => {
  const m = state.lastMatch;
  const emoji = m.result === 'W' ? '🎉' : m.result === 'D' ? '🤝' : '😢';
  const txt = m.result === 'W' ? `${state.playerName} 赢了！` : m.result === 'D' ? `平局` : `${state.playerName} 输了`;
  app.innerHTML = `
    <div class="card gameover">
      <div style="font-size:60px">${emoji}</div>
      <h2>${txt}</h2>
      <div class="big">${flag(m.myTeam)} ${m.gf} - ${m.ga} ${flag(m.opp)}</div>
      <div style="margin:8px 0">${name(m.myTeam)} vs ${name(m.opp)}</div>
      <div class="stat-row">
        <div class="stat-box" style="background:#0F9D58"><div class="stat-label" style="color:#fff">难度</div><div class="stat-value" style="color:#fff;font-size:14px">${m.diff === 'easy' ? '简单' : m.diff === 'medium' ? '普通' : '困难'}</div></div>
        <div class="stat-box" style="background:#2196F3"><div class="stat-label" style="color:#fff">比分</div><div class="stat-value" style="color:#fff;font-size:14px">${m.gf}:${m.ga}</div></div>
      </div>
    </div>
    <div class="card">
      <button class="btn" id="rematch">🔁 再战一场</button>
      <button class="btn btn-blue mt-8" id="changeTeam">⚽ 换队</button>
      <button class="btn btn-green mt-8" id="backHome">🏠 回主页</button>
    </div>
    <div class="card">
      <div class="card-title">💬 洛可的赛后点评</div>
      <div style="font-size:13px;line-height:1.7;color:#333">${matchComment(m)}</div>
    </div>
  `;
  $('#rematch').addEventListener('click', () => {
    const others = Object.keys(TEAMS).filter(id => id !== state.selectedTeam);
    state.opponent = others[Math.floor(Math.random() * others.length)];
    startQuickMatch();
  });
  $('#changeTeam').addEventListener('click', () => { state.view = 'pick'; render(); });
  $('#backHome').addEventListener('click', () => { state.view = 'home'; render(); });
};

const matchComment = (m) => {
  if (m.result === 'W') {
    if (m.gf >= 5) return `哇！大胜 ${m.gf}-${m.ga}！${state.playerName} 是 MVP 啊 🏆 进球集锦可以做 10 分钟了！`;
    if (m.gf >= 3) return `漂亮的胜仗！${flag(m.myTeam)} 进攻线火力全开 ⚽ 继续保持！`;
    return `稳健的胜利。${name(m.myTeam)} 后防立功了，下场争取更多进球！`;
  }
  if (m.result === 'D') {
    return `势均力敌！${name(m.myTeam)} 和 ${name(m.opp)} 握手言和，下场要主动出击 ⚡`;
  }
  if (m.ga - m.gf >= 4) return `今天 ${name(m.myTeam)} 不在状态，没关系，足球是圆的，下次来 ⚽`;
  return `惜败 ${m.gf}-${m.ga}。${name(m.opp)} 略胜一筹，但 ${state.playerName} 拼到最后一刻 💪`;
};

const renderGame = (app) => {
  app.innerHTML = `
    <div class="header" style="padding:8px">
      <h1 style="font-size:18px">${flag(state.selectedTeam)} ${name(state.selectedTeam)} vs ${flag(state.opponent)} ${name(state.opponent)}</h1>
    </div>
    <div class="game-wrap">
      <canvas id="gameCanvas"></canvas>
      <div class="game-hud">
        <div class="hud-score" id="hudLeft">0</div>
        <div class="hud-time" id="hudTime">0'</div>
        <div class="hud-score" id="hudRight">0</div>
      </div>
      <div class="joystick" id="joystick">
        <div class="joystick-knob" id="joystickKnob"></div>
      </div>
      <div class="action-btns">
        <div class="action-btn btn-pass" id="btnPass">传球</div>
        <div class="action-btn btn-shoot" id="btnShoot">射门</div>
        <div class="action-btn btn-sprint" id="btnSprint">冲刺</div>
      </div>
    </div>
    <div class="card" style="background:rgba(0,0,0,0.4);color:#fff">
      <div style="font-size:12px;line-height:1.7;text-align:center">
        🎮 <strong>左下摇杆</strong>控制蓝色 ⭐ 球员移动<br>
        🔴 射门 · 🔵 传球 · 🟠 冲刺加速<br>
        ⚽ 进球！把球踢进对方球门
      </div>
    </div>
    <div class="card" style="background:rgba(244,67,54,0.9)">
      <button class="btn" id="forfeit" style="background:#fff;color:#d32f2f">🚪 放弃比赛</button>
    </div>
  `;
  $('#forfeit').addEventListener('click', () => {
    if (confirm('放弃当前比赛？')) {
      state.game.phase = 'ended';
      const m = {date:new Date().toISOString(),myTeam:state.selectedTeam,opp:state.opponent,gf:state.game.score[0],ga:state.game.score[1],result:state.game.score[0]>=state.game.score[1]?(state.game.score[0]>state.game.score[1]?'W':'D'):'L',diff:state.difficulty};
      state.lastMatch = m;
      state.history.unshift(m);
      save();
      state.view = 'gameover';
      render();
    }
  });
};

// ============= 赛事 (Tournament) =============
const renderTournament = (app) => {
  if (!state.tournament.teams || state.tournament.round === 0) {
    // 选队
    const allIds = Object.keys(TEAMS);
    app.innerHTML = `
      <div class="header"><h1>🏆 洛可杯赛</h1><div class="subtitle">小组赛 + 淘汰赛 一条龙</div></div>
      <div class="card">
        <div class="card-title">选择你的主队</div>
        <div class="team-pick">${allIds.map(id => `<div class="team-tile" data-id="${id}"><span class="flag">${TEAMS[id].f}</span>${TEAMS[id].n}</div>`).join('')}</div>
      </div>
      <div class="card">
        <div class="card-title">难度</div>
        <div class="diff-row">
          <div class="diff-pill ${state.difficulty==='easy'?'active':''}" data-diff="easy">😊 简单</div>
          <div class="diff-pill ${state.difficulty==='medium'?'active':''}" data-diff="medium">😎 普通</div>
          <div class="diff-pill ${state.difficulty==='hard'?'active':''}" data-diff="hard">🔥 困难</div>
        </div>
      </div>
      <div class="card">
        <button class="btn" id="startTour" disabled>开始洛可杯 →</button>
        <button class="btn btn-blue mt-8" id="goHome">← 主页</button>
      </div>
    `;
    $$('.team-tile').forEach(t => t.addEventListener('click', () => {
      $$('.team-tile').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      state.tournament.myTeam = t.dataset.id;
      $('#startTour').disabled = false;
    }));
    $$('.diff-pill').forEach(p => p.addEventListener('click', () => {
      state.difficulty = p.dataset.diff;
      render();
    }));
    $('#startTour').addEventListener('click', () => {
      if (!state.tournament.myTeam) return;
      const all = Object.keys(TEAMS).filter(id => id !== state.tournament.myTeam);
      // 随机选 7 个对手
      const shuffled = all.sort(() => Math.random() - 0.5).slice(0, 7);
      state.tournament.teams = [state.tournament.myTeam, ...shuffled];
      state.tournament.round = 1;
      state.tournament.results = [];
      state.opponent = shuffled[0];
      save();
      startQuickMatch();
    });
    $('#goHome').addEventListener('click', () => { state.view = 'home'; render(); });
  } else {
    // 显示赛程
    const r = state.tournament.round;
    const total = 8;
    const roundName = r === 1 ? '1/8 决赛' : r === 2 ? '1/4 决赛' : r === 3 ? '半决赛' : r === 4 ? '决赛' : '完成';
    app.innerHTML = `
      <div class="header"><h1>🏆 洛可杯赛</h1><div class="subtitle">第 ${r}/${total} 轮 · ${roundName}</div></div>
      <div class="card">
        <div class="card-title">📊 战绩</div>
        <div style="font-size:14px;line-height:1.8">
          ${state.tournament.results.map((res, i) => `
            <div style="padding:6px 0;border-bottom:1px solid #eee">
              <strong>第 ${i+1} 轮</strong> · ${flag(res.myTeam)} ${res.gf}-${res.ga} ${flag(res.opp)}
              <span style="float:right;color:${res.result==='W'?'#0F9D58':res.result==='L'?'#f44336':'#666'}">${res.result==='W'?'胜':res.result==='L'?'负':'平'}</span>
            </div>
          `).join('') || '<div class="empty-state">还没比赛</div>'}
        </div>
      </div>
      ${r <= total ? `
        <div class="card">
          <div class="card-title">⚽ 下一场</div>
          <p>对手：<strong>${flag(state.opponent)} ${name(state.opponent)}</strong></p>
          <button class="btn" id="nextMatch">开打 →</button>
        </div>
      ` : `
        <div class="card text-center">
          <div style="font-size:48px">🏆</div>
          <h2 style="color:#FFD700">赛事完成！</h2>
          <div>${countWinsTournament()}胜 ${countDrawsTournament()}平 ${countLossesTournament()}负</div>
          <button class="btn btn-blue mt-12" id="resetTour">🔄 重新开始</button>
        </div>
      `}
      <div class="card">
        <button class="btn btn-blue" id="goHome">← 主页</button>
      </div>
    `;
    if ($('#nextMatch')) $('#nextMatch').addEventListener('click', () => {
      const teams = state.tournament.teams;
      const idx = state.tournament.round;
      if (idx < teams.length) {
        state.opponent = teams[idx];
      } else {
        // 随机补充
        const remaining = Object.keys(TEAMS).filter(id => id !== state.tournament.myTeam);
        state.opponent = remaining[Math.floor(Math.random() * remaining.length)];
      }
      save();
      startQuickMatch();
    });
    if ($('#resetTour')) $('#resetTour').addEventListener('click', () => {
      state.tournament = {teams:null,round:0,bracket:null,results:[],myTeam:null};
      save();
      render();
    });
    $('#goHome').addEventListener('click', () => { state.view = 'home'; render(); });
  }
};
const countWinsTournament = () => state.tournament.results.filter(r => r.result === 'W').length;
const countDrawsTournament = () => state.tournament.results.filter(r => r.result === 'D').length;
const countLossesTournament = () => state.tournament.results.filter(r => r.result === 'L').length;

// === 历史 ===
const renderHistory = (app) => {
  app.innerHTML = `
    <div class="header"><h1>📜 战报</h1><div class="subtitle">最近 ${state.history.length} 场</div></div>
    ${state.history.length === 0 ? '<div class="card empty-state">还没比赛，去打一场吧 ⚽</div>' : ''}
    ${state.history.map((m, i) => `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:700">${flag(m.myTeam)} ${name(m.myTeam)} <span style="color:#666">vs</span> ${flag(m.opp)} ${name(m.opp)}</div>
            <div style="font-size:11px;color:#666">${new Date(m.date).toLocaleString('zh-CN')} · ${m.diff === 'easy' ? '简单' : m.diff === 'medium' ? '普通' : '困难'}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:20px;font-weight:800">${m.gf} - ${m.ga}</div>
            <div style="font-size:11px;color:${m.result==='W'?'#0F9D58':m.result==='L'?'#f44336':'#666'}">${m.result==='W'?'胜':m.result==='L'?'负':'平'}</div>
          </div>
        </div>
      </div>
    `).join('')}
    <div class="card">
      <button class="btn btn-red" id="clearH">🗑️ 清空战报</button>
    </div>
  `;
  $('#clearH').addEventListener('click', () => {
    if (confirm('清空所有战报？')) { state.history = []; save(); render(); }
  });
};

// ============= Tab 导航 =============
$$('.tab').forEach(t => t.addEventListener('click', () => {
  state.view = t.dataset.tab;
  render();
}));

render();
</script>
</body>
</html>
